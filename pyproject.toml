[project]
name = "plex-queue"
version = "0.1.0"
description = "Telegram bot that checks Plex before queueing Deluge downloads, with owner library tidy and full Plex refresh."
requires-python = ">=3.11"
dependencies = [
  "deluge-client>=1.10.2",
  "python-telegram-bot>=21.6",
  "PyYAML>=6.0",
  "Send2Trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
otel = [
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
]

[project.scripts]
plex-queue = "plex_queue.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
