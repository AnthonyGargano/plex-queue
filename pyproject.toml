[project]
name = "plex-queue"
version = "0.1.0"
description = "Telegram bot that checks the Plex library before queueing a Deluge download."
requires-python = ">=3.11"
dependencies = [
  "deluge-client>=1.10.2",
  "python-telegram-bot>=21.6",
  "PyYAML>=6.0",
  "Send2Trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plex-queue = "plex_queue.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
