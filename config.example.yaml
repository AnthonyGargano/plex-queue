telegram:
  token: "PUT_BOT_TOKEN_HERE"
  # At least 16 characters. Example: python -c "import secrets; print(secrets.token_hex(16))"
  setup_secret: "change-this-secret"
  # Prefer setting your numeric Telegram id here after first claim (authoritative).
  # 0 means ownership comes from a MAC-signed data/access.json after /claim.
  owner_id: 0
  # Prefer empty here and /allow after claim. YAML entries cannot be removed with /deny.
  allowed_user_ids: []
  # Guests (non-owner) request budget per hour and max unfinished Deluge torrents.
  guest_hourly_limit: 5
  guest_max_active: 3

vm:
  name: UbuntuClean

deluge:
  username: localclient
  password: "PUT_DELUGE_PASSWORD_HERE"
  # Leave blank to use Deluge's folder on the VM (/home/ttt/Downloads).
  download_location: ""
  ssh:
    host: "PUT_VM_SSH_HOST_HERE"
    user: ttt
    key_path: '%USERPROFILE%\.ssh\plex-queue_ed25519'
    # Dedicated known_hosts file. The bot pins the VM key here and refuses changes.
    known_hosts: 'data/ssh_known_hosts'
    # false (default): require ssh-keyscan / manual pin. true: one-time accept-new TOFU.
    allow_tofu: false
    local_port: 15884
    remote_port: 58846

library:
  # A copy at this height or higher is "already on Plex".
  min_height: 1080
  plex_db: '%LOCALAPPDATA%\Plex Media Server\Plug-in Support\Databases\com.plexapp.plugins.library.db'
  roots:
    - 'D:\Movies'
    - 'D:\Shows'
    - 'E:\Shows'
    - 'G:\Kids Shows'
    - 'H:\Documentary'
    - 'H:\Kids Movies'
    - 'I:\Movies'
    - 'L:\Anime\Movies'
    - 'L:\Anime\Shows'

search:
  # Must be https and not a private/loopback IP (config-tamper SSRF guard).
  endpoint: "https://apibay.org/q.php"

import:
  every_minutes: 10
  # Leave at least this much free on the drive after the copy.
  margin_gb: 2
  # Optional on Windows (/drop uses the Recycle Bin). Required elsewhere.
  trash_dir: 'D:\Movies\_trash'
  movies:
    - 'D:\Movies'
    - 'I:\Movies'
  shows:
    - 'D:\Shows'
    - 'E:\Shows'

# Library tidy (/tidy or: python -m plex_queue tidy).
# Propose-and-confirm only: owner must apply before any move/trash/rename/scan.
# Renames clean release-junk movie folders; they do not rewrite episode titles.
# Moves trust specialized shelves (kids/anime/doc/standup/…) and avoid yanking extras.
# auto is reserved for a future unattended apply path and is not wired yet —
# leave false; setting true only logs a warning.
#
# Full Plex rescan (owner): python -m plex_queue refresh   or Telegram /refresh
# Local index only: /scan
tidy:
  auto: false
  # Optional. When omitted, buckets are derived from library.roots + import folders.
  # buckets:
  #   movies: ['D:\Movies', 'I:\Movies']
  #   shows: ['D:\Shows', 'E:\Shows']
  #   kids_movies: ['H:\Kids Movies']
  #   kids_shows: ['G:\Kids Shows']
  #   anime_movies: ['L:\Anime\Movies']
  #   anime_shows: ['L:\Anime\Shows']
  #   documentary: ['H:\Documentary']
  #   christmas: ['L:\Christmas Movies']
  #   standup: ['L:\Standup']
  #   workouts: ['L:\Workouts']
