telegram:
  token: "PUT_BOT_TOKEN_HERE"
  setup_secret: "change-this-secret"
  # Your numeric Telegram id. 0 until you send /claim <setup_secret> to the bot.
  owner_id: 0
  allowed_user_ids: []

vm:
  name: UbuntuClean

deluge:
  username: localclient
  password: "PUT_DELUGE_PASSWORD_HERE"
  # Leave blank to use Deluge's folder on the VM (/home/ttt/Downloads).
  download_location: ""
  ssh:
    host: 172.30.161.89
    user: ttt
    key_path: '%USERPROFILE%\.ssh\plex-queue_ed25519'
    # Dedicated known_hosts file. The bot pins the VM key here and refuses changes.
    known_hosts: 'data/ssh_known_hosts'
    local_port: 15884
    remote_port: 58846

library:
  # A copy at this height or higher is "already on Plex".
  min_height: 1080
  plex_db: '%LOCALAPPDATA%\Plex Media Server\Plug-in Support\Databases\com.plexapp.plugins.library.db'
  roots:
    - 'D:\Movies4'
    - 'D:\Shows4'
    - 'E:\3tb xternal\Shows'
    - 'G:\Kids Shows2'
    - 'G:\Shows2'
    - 'H:\Documentary'
    - 'H:\Kids Movies2'
    - 'H:\Movies3'
    - 'H:\Pure Pwnage'
    - 'H:\Pure_pwnage_Season1and2'
    - 'I:\Movies'
    - 'J:\Kids Movies'
    - 'J:\Movies2'
    - 'J:\ToP'
    - 'L:\Anime\Movies'
    - 'L:\Anime\Shows'
    - 'L:\Christmas Movies'
    - 'L:\Documentary'
    - 'L:\Kid Shows'
    - 'L:\Standup'
    - 'L:\Workouts'

search:
  endpoint: "https://apibay.org/q.php"

import:
  every_minutes: 10
  # Leave at least this much free on the drive after the copy.
  margin_gb: 2
  # Optional on Windows (/drop uses the Recycle Bin). Required elsewhere.
  trash_dir: 'D:\Movies4\_trash'
  movies:
    - 'D:\Movies4'
    - 'H:\Movies3'
    - 'I:\Movies'
    - 'J:\Movies2'
  shows:
    - 'D:\Shows4'
    - 'E:\3tb xternal\Shows'
    - 'G:\Shows2'

# Library tidy (/tidy). Propose fixes; owner confirms before any move/trash.
# auto stays false until proposals look trustworthy.
tidy:
  auto: false
  # Optional. When omitted, buckets are derived from library.roots + import folders.
  # buckets:
  #   movies: ['D:\Movies4', 'H:\Movies3', 'I:\Movies', 'J:\Movies2']
  #   shows: ['D:\Shows4', 'E:\3tb xternal\Shows', 'G:\Shows2']
  #   kids_movies: ['H:\Kids Movies2', 'J:\Kids Movies']
  #   kids_shows: ['G:\Kids Shows2', 'L:\Kid Shows']
  #   anime_movies: ['L:\Anime\Movies']
  #   anime_shows: ['L:\Anime\Shows']
  #   christmas: ['L:\Christmas Movies']
  #   documentary: ['H:\Documentary', 'L:\Documentary']
  #   standup: ['L:\Standup']
  #   workouts: ['L:\Workouts']
