# Dual-write: Kafka bus + direct backends for immediate Grafana.
# Kafka topics use OTLP protobuf for future consumers / autotick.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_mib: 512

exporters:
  kafka/traces:
    brokers:
      - kafka:9092
    topic: otel-traces
    encoding: otlp_proto
    protocol_version: 2.0.0
  kafka/metrics:
    brokers:
      - kafka:9092
    topic: otel-metrics
    encoding: otlp_proto
    protocol_version: 2.0.0
  kafka/logs:
    brokers:
      - kafka:9092
    topic: otel-logs
    encoding: otlp_proto
    protocol_version: 2.0.0

  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/traces, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/metrics, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka/logs, otlphttp/loki]
